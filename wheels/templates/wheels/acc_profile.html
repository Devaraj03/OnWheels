{% extends 'wheels/base.html' %}
{% block title %}Profile{% endblock %}

{% block content %}

<div class="container mt-5">

    <!-- PROFILE HEADER -->
    <div class="card mb-4 shadow-sm">
        <div class="card-body d-flex justify-content-between align-items-center">

            <div>
                <h4 class="mb-1">{{ user_obj.username }}</h4>
                <p class="text-muted mb-0">{{ user_obj.email }}</p>
                <small class="text-muted">
                    Joined: {{ user_obj.date_joined|date:"M d, Y" }}
                </small>
            </div>

            <div>
                <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#profileModal">

                    Edit Profile

                </button>
            </div>

        </div>
    </div>







    <div class="modal fade" id="profileModal">

        <div class="modal-dialog">

            <div class="modal-content">

                <form method="POST" action="{% url 'wheels:update_profile' %}">

                    {% csrf_token %}

                    <div class="modal-header">

                        <h5>Edit Profile</h5>

                        <button type="button" class="btn-close" data-bs-dismiss="modal">
                        </button>

                    </div>

                    <div class="modal-body">

                        <input
                            type="text"
                            name="username"
                            class="form-control mb-3"
                            placeholder="Username"
                            value="{{ user_obj.username }}"
                            required>

                        <input
                            type="text"
                            name="first_name"
                            class="form-control mb-3"
                            placeholder="First Name"
                            value="{{ user_obj.first_name }}">

                        <input
                            type="text"
                            name="last_name"
                            class="form-control mb-3"
                            placeholder="Last Name"
                            value="{{ user_obj.last_name }}">

                        <input
                            type="email"
                            name="email"
                            class="form-control"
                            placeholder="Email"
                            value="{{ user_obj.email }}">

                    </div>

                    <div class="modal-footer">

                        <button class="btn btn-primary">

                            Save

                        </button>

                    </div>

                </form>

            </div>
        </div>
    </div>
</div>

{% endblock %}
